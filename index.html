<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芊芊代購 - 智慧團務整理系統</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-color: #f06292;
      --primary-hover: #e91e63;
      --sidebar-bg: #f8bbd0;
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background-color: #f8bbd0;
      border-right: 1px solid #f48fb1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      flex-shrink: 0;
    }
    .sidebar h2 { font-size: 1.1rem; color: #880e4f; margin-top: 0; margin-bottom: 15px; text-align: center; }
    .btn-new-group {
      background-color: #c2185b; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; width: 100%; text-align: center;
    }
    .btn-new-group:hover { background-color: #ad1457; }
    .group-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .group-item {
      display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255, 255, 255, 0.6); border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background 0.2s;
    }
    .group-item:hover { background: rgba(255, 255, 255, 0.9); }
    .group-item.active { background: white; border-left: 4px solid var(--primary-hover); font-weight: bold; color: #c2185b; }
    .btn-group-del { background: none; border: none; cursor: pointer; font-size: 0.9rem; opacity: 0.6; padding: 2px 5px; }
    .btn-group-del:hover { opacity: 1; color: #d32f2f; }

    .main-content { flex: 1; overflow-y: auto; padding: 25px; background: var(--bg-color); }
    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
    h1 { color: #c2185b; margin-top: 0; margin-bottom: 20px; font-size: 1.5rem; }
    .section-title { font-size: 1.1rem; font-weight: bold; color: #880e4f; border-left: 5px solid var(--primary-color); padding-left: 10px; margin-top: 25px; margin-bottom: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    label { font-size: 0.88rem; font-weight: bold; margin-bottom: 5px; display: block; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    textarea { height: 130px; resize: vertical; }
    .product-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr 1.2fr 35px 35px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .btn { background-color: var(--primary-color); color: white; border: none; padding: 9px 16px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #78909c; }
    .btn-secondary:hover { background-color: #546e7a; }
    .btn-success { background-color: #2e7d32; }
    .btn-success:hover { background-color: #1b5e20; }
    .btn-reset { background-color: #ff9800; }
    .btn-reset:hover { background-color: #f57c00; }
    .btn-copy { background-color: #0288d1; padding: 7px; border-radius: 6px; color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-del { background-color: #ef5350; padding: 7px; border-radius: 50%; color: white; border: none; cursor: pointer; }
    .actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 9px; text-align: left; font-size: 0.88rem; }
    th { background-color: #f8bbd0; color: #880e4f; }
    tr:nth-child(even) { background-color: #fcfcfc; }
    .badge-vip { background: #ffe082; color: #f57f17; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .badge-success { background: #c8e6c9; color: #2e7d32; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .badge-fail { background: #ffcdd2; color: #c62828; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .import-box { background-color: #f3e5f5; border: 2px dashed #ab47bc; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- 左側專案欄 -->
  <div class="sidebar">
    <h2>🛍️ 團務專案列表</h2>
    <button class="btn-new-group" onclick="createNewGroup()">＋ 新增團務專案</button>
    <div class="group-list" id="groupSidebarList"></div>
  </div>

  <!-- 主介面區 -->
  <div class="main-content">
    <div class="container">
      <h1 id="currentGroupTitle">團務整理系統</h1>

      <!-- 舊檔還原備用 -->
      <div class="import-box">
        📂 <b>採購回來？上傳舊版『開團登記表 Excel』還原名單：</b>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="margin-top: 5px;" onchange="importExcelFile(event)">
      </div>

      <!-- 步驟 1：開團設定 -->
      <div class="section-title">步驟 1：本團基本設定與商品清單</div>
      <div class="grid-3">
        <div>
          <label>團務名稱</label>
          <input type="text" id="groupName" onchange="updateCurrentGroupName(this.value)">
        </div>
        <div>
          <label>全團預設限購 (填0不限)</label>
          <input type="number" id="globalLimitQty" value="1" min="0" onchange="saveCurrentGroupData()">
        </div>
        <div>
          <label>計算匯率 (日幣 × 匯率 ＝ 台幣)</label>
          <input type="number" id="exchangeRate" value="0.24" step="0.001" onchange="saveCurrentGroupData()">
        </div>
      </div>

      <div style="margin-top: 15px;">
        <label>商品清單 (輸入日幣會自動試算台幣，也可手動修改台幣與獨立限購)</label>
        <div id="productList"></div>
        <datalist id="historyProductList"></datalist>
        <div class="actions">
          <button class="btn btn-secondary" onclick="addProductRow()" style="margin-top: 5px;">+ 新增商品</button>
          <button class="btn btn-del" style="border-radius:6px; padding:9px 16px;" onclick="clearProductRows()">🗑️ 一鍵清空商品清單</button>
        </div>
      </div>

      <!-- 步驟 2：匯入喊單 -->
      <div class="section-title">步驟 2：匯入喊單文字 (貼上 LINE 記事本內容)</div>
      <textarea id="rawLineText" placeholder="請貼上 LINE 記事本對話內文..." onchange="saveCurrentGroupData()"></textarea>
      
      <div class="actions">
        <button class="btn" onclick="processOrders()">1. 解析留言並匯入</button>
        <button class="btn btn-secondary" onclick="sortOrders()">2. 智慧整理排序 (可自吃一車優先)</button>
        <button class="btn btn-reset" onclick="clearRawTextAndPreview()">🧹 一鍵清空喊單文字與預覽名單</button>
      </div>

      <!-- 整理結果預覽 -->
      <div class="section-title">階段一：登記名單預覽 (<span id="buyerCount">0</span> 人)</div>
      <div style="overflow-x: auto;">
        <table id="previewTable">
          <thead>
            <tr>
              <th>名字</th>
              <th>品項</th>
              <th>台幣價格</th>
              <th>日幣價格</th>
              <th>備註 (尺寸/自吃一單/替代說明)</th>
            </tr>
          </thead>
          <tbody id="previewBody">
            <tr><td colspan="5" style="text-align:center; color:#999;">尚未匯入名單</td></tr>
          </tbody>
        </table>
      </div>

      <div class="actions" style="margin-top: 15px;">
        <button class="btn btn-success" onclick="exportGroupExcel()">📥 匯出 5 欄格式『開團登記表』Excel</button>
      </div>

      <!-- 步驟 3：最終買到名單 -->
      <div class="section-title">階段二：採購分配結果</div>
      <button class="btn" onclick="calculateFinalResults()">3. 生成買到名單 (請先在上方填寫實際買到數)</button>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>名字</th>
              <th>買到品項</th>
              <th>數量</th>
              <th>分配結果</th>
            </tr>
          </thead>
          <tbody id="finalBody">
            <tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>
          </tbody>
        </table>
      </div>

      <div class="actions" style="margin-top: 15px;">
        <button class="btn btn-success" onclick="exportFinalExcel()">📥 匯出『最終買到名單』Excel</button>
      </div>
    </div>
  </div>

<script>
  let groupsData = JSON.parse(localStorage.getItem('qian_groups_data') || '{}');
  let currentGroupId = localStorage.getItem('qian_current_group_id') || '';
  let globalHistory = JSON.parse(localStorage.getItem('qian_global_history') || '{}');

  window.onload = function() {
    if (Object.keys(groupsData).length === 0) {
      createNewGroup('0928平行受注團', true);
    } else {
      if (!currentGroupId || !groupsData[currentGroupId]) {
        currentGroupId = Object.keys(groupsData)[0];
      }
      renderSidebar();
      loadGroupData(currentGroupId);
    }
    updateDatalist();
  };

  function createNewGroup(defaultName = '', isFirstTime = false) {
    const id = 'group_' + Date.now();
    const name = defaultName || prompt('請輸入新團務名稱：', '新開團務');
    if (!name) return;

    groupsData[id] = {
      id,
      name,
      rate: 0.24,
      globalLimit: 1,
      products: isFirstTime ? [
        { name: '南瓜兔兔', jpy: 2420, twd: 581, limit: '', bought: '' },
        { name: '幽靈吉伊', jpy: 1540, twd: 370, limit: '', bought: '' },
        { name: '幽靈小八', jpy: 1540, twd: 370, limit: '', bought: '' },
        { name: '幽靈兔兔', jpy: 1540, twd: 370, limit: '', bought: '' },
        { name: '夜光壓克力鑰匙圈', jpy: 1540, twd: 370, limit: '', bought: '' },
        { name: '吉伊磁鐵', jpy: 770, twd: 185, limit: '', bought: '' },
        { name: '兔兔磁鐵', jpy: 770, twd: 185, limit: '', bought: '' },
        { name: '小八磁鐵', jpy: 770, twd: 185, limit: '', bought: '' },
        { name: '吉伊貼紙', jpy: 330, twd: 80, limit: '', bought: '' },
        { name: '小八貼紙', jpy: 330, twd: 80, limit: '', bought: '' },
        { name: '兔兔貼紙', jpy: 330, twd: 80, limit: '', bought: '' },
        { name: '夜光踢恤', jpy: 4180, twd: 1003, limit: '', bought: '' },
        { name: '吉伊束口包', jpy: 2310, twd: 555, limit: '', bought: '' },
        { name: '兔兔束口包', jpy: 2310, twd: 555, limit: '', bought: '' },
        { name: '小八束口包', jpy: 2310, twd: 555, limit: '', bought: '' },
        { name: '幽靈環保袋', jpy: 2090, twd: 502, limit: '', bought: '' },
        { name: '南瓜兔兔衣服', jpy: 4180, twd: 1003, limit: '', bought: '' }
      ] : [],
      rawText: '',
      buyers: []
    };

    currentGroupId = id;
    saveAllToStorage();
    renderSidebar();
    loadGroupData(id);

    if (!isFirstTime) addProductRow();
  }

  function deleteGroup(id, e) {
    e.stopPropagation();
    const groupName = groupsData[id] ? groupsData[id].name : '該團務';
    if (confirm(`確定要刪除專案【${groupName}】嗎？`)) {
      delete groupsData[id];
      const remainingIds = Object.keys(groupsData);
      if (remainingIds.length > 0) {
        currentGroupId = remainingIds[0];
      } else {
        createNewGroup('新開團務', false);
        return;
      }
      saveAllToStorage();
      renderSidebar();
      loadGroupData(currentGroupId);
    }
  }

  function renderSidebar() {
    const listDiv = document.getElementById('groupSidebarList');
    listDiv.innerHTML = '';

    Object.keys(groupsData).forEach(id => {
      const g = groupsData[id];
      const item = document.createElement('div');
      item.className = 'group-item' + (id === currentGroupId ? ' active' : '');
      item.onclick = () => switchGroup(id);
      item.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${g.name}</span>
        <button class="btn-group-del" title="刪除專案" onclick="deleteGroup('${id}', event)">🗑️</button>
      `;
      listDiv.appendChild(item);
    });
  }

  function switchGroup(id) {
    saveCurrentGroupData();
    currentGroupId = id;
    localStorage.setItem('qian_current_group_id', currentGroupId);
    renderSidebar();
    loadGroupData(id);
  }

  function loadGroupData(id) {
    const g = groupsData[id];
    if (!g) return;

    document.getElementById('groupName').value = g.name;
    document.getElementById('exchangeRate').value = g.rate || 0.24;
    document.getElementById('globalLimitQty').value = g.globalLimit !== undefined ? g.globalLimit : 1;
    document.getElementById('rawLineText').value = g.rawText || '';
    document.getElementById('currentGroupTitle').innerText = g.name;

    const pList = document.getElementById('productList');
    pList.innerHTML = '';
    if (g.products && g.products.length > 0) {
      g.products.forEach(p => addProductRow(p.name, p.jpy, p.twd, p.limit, p.bought));
    } else {
      addProductRow();
    }

    renderPreview();
  }

  function saveCurrentGroupData() {
    if (!currentGroupId || !groupsData[currentGroupId]) return;

    const g = groupsData[currentGroupId];
    g.name = document.getElementById('groupName').value.trim() || '未命名團務';
    g.rate = parseFloat(document.getElementById('exchangeRate').value) || 0.24;
    g.globalLimit = parseInt(document.getElementById('globalLimitQty').value, 10);
    g.rawText = document.getElementById('rawLineText').value;

    const rows = document.querySelectorAll('.product-row');
    const products = [];
    rows.forEach(r => {
      const name = r.querySelector('.p-name').value.trim();
      const jpy = parseFloat(r.querySelector('.p-jpy').value) || 0;
      const twd = parseFloat(r.querySelector('.p-twd').value) || 0;
      const limit = r.querySelector('.p-limit').value;
      const bought = r.querySelector('.p-bought').value;
      if (name) {
        products.push({ name, jpy, twd, limit, bought });
        globalHistory[name] = { name, jpy, twd, limit };
      }
    });
    g.products = products;

    saveAllToStorage();
    updateDatalist();
  }

  function saveAllToStorage() {
    localStorage.setItem('qian_groups_data', JSON.stringify(groupsData));
    localStorage.setItem('qian_current_group_id', currentGroupId);
    localStorage.setItem('qian_global_history', JSON.stringify(globalHistory));
  }

  function updateCurrentGroupName(val) {
    document.getElementById('currentGroupTitle').innerText = val || '團務整理系統';
    saveCurrentGroupData();
    renderSidebar();
  }

  function updateDatalist() {
    const dl = document.getElementById('historyProductList');
    dl.innerHTML = '';
    Object.keys(globalHistory).forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      dl.appendChild(opt);
    });
  }

  function addProductRow(name = '', jpy = '', twd = '', limit = '', bought = '') {
    const div = document.createElement('div');
    div.className = 'product-row';
    div.innerHTML = `
      <input type="text" placeholder="商品名稱" class="p-name" value="${name}" list="historyProductList" onchange="onNameChange(this)">
      <input type="number" placeholder="日幣" class="p-jpy" value="${jpy}" oninput="calcRowTwd(this)">
      <input type="number" placeholder="台幣" class="p-twd" value="${twd}" onchange="saveCurrentGroupData()">
      <input type="number" placeholder="限購" class="p-limit" value="${limit}" onchange="saveCurrentGroupData()">
      <input type="number" placeholder="買到" class="p-bought" value="${bought}" onchange="saveCurrentGroupData()">
      <button class="btn-copy" title="複製此商品" onclick="copyProductRow(this)">📋</button>
      <button class="btn-del" title="刪除" onclick="this.parentElement.remove(); saveCurrentGroupData();">✕</button>
    `;
    document.getElementById('productList').appendChild(div);
  }

  function clearProductRows() {
    if (confirm('確定要清空當前專案的商品清單嗎？')) {
      document.getElementById('productList').innerHTML = '';
      saveCurrentGroupData();
    }
  }

  function onNameChange(elem) {
    const name = elem.value.trim();
    if (globalHistory[name]) {
      const row = elem.parentElement;
      row.querySelector('.p-jpy').value = globalHistory[name].jpy;
      row.querySelector('.p-twd').value = globalHistory[name].twd;
      row.querySelector('.p-limit').value = globalHistory[name].limit;
    }
    saveCurrentGroupData();
  }

  function calcRowTwd(inputElem) {
    const row = inputElem.parentElement;
    const jpy = parseFloat(inputElem.value) || 0;
    const rate = parseFloat(document.getElementById('exchangeRate').value) || 0.24;
    const twdInput = row.querySelector('.p-twd');
    if (jpy > 0) {
      twdInput.value = Math.round(jpy * rate);
    }
    saveCurrentGroupData();
  }

  function copyProductRow(btnElem) {
    const row = btnElem.parentElement;
    const name = row.querySelector('.p-name').value;
    const jpy = row.querySelector('.p-jpy').value;
    const twd = row.querySelector('.p-twd').value;
    const limit = row.querySelector('.p-limit').value;
    const bought = row.querySelector('.p-bought').value;
    
    addProductRow(name, jpy, twd, limit, bought);
    saveCurrentGroupData();
  }

  function clearRawTextAndPreview() {
    if (confirm('確定要清空喊單文字與解析結果嗎？')) {
      document.getElementById('rawLineText').value = '';
      const g = groupsData[currentGroupId];
      if (g) {
        g.rawText = '';
        g.buyers = [];
        g.calculatedResults = [];
      }
      saveAllToStorage();
      renderPreview();
      document.getElementById('finalBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>`;
      alert('喊單文字與預覽名單已成功清空！');
    }
  }

  function processOrders() {
    saveCurrentGroupData();
    const g = groupsData[currentGroupId];
    const rawText = g.rawText;
    if (!rawText || !rawText.trim()) {
      alert('請先貼上 LINE 喊單對話！');
      return;
    }

    const products = g.products || [];
    const globalLimit = isNaN(g.globalLimit) ? 1 : g.globalLimit;

    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const buyerOrder = [];
    const buyerMap = {};

    let currentName = '';

    const timePattern = /^(\d+月\d+日|\d+小時前|昨天|前天|今天|\d+:\d+|\d+月\d+日\s*\d+:\d+|前天\s*上午|昨天\s*下午|\d+小時前)/;
    const junkWords = ['可分境內運', '可分運', '追加', '補充', '取消', '平攤運費', '謝謝', '可分', '可分境'];

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      if (timePattern.test(line)) continue;

      if (line.includes('可自吃')) {
        if (currentName && buyerMap[currentName]) {
          buyerMap[currentName].notes = (buyerMap[currentName].notes ? buyerMap[currentName].notes + '；' : '') + line;
          buyerMap[currentName].canVip = true;
        }
        continue;
      }

      if (line.includes('取消')) {
        if (currentName && buyerMap[currentName]) {
          products.forEach(p => {
            if (line.includes(p.name) || p.name.includes(line.replace(/取消|\s+/g, ''))) {
              delete buyerMap[currentName].items[p.name];
            }
          });
          buyerMap[currentName].notes = (buyerMap[currentName].notes ? buyerMap[currentName].notes + '；' : '') + line;
        }
        continue;
      }

      let matchedLine = false;

      products.forEach(p => {
        let isMatch = line.includes(p.name) || p.name.includes(line.replace(/小娃|吊飾|娃|\(小\)|（小）|鑰匙圈|\s+/g, ''));

        if (isMatch) {
          matchedLine = true;
          let qty = 1;
          const qtyMatch = line.match(/(?:\+|\*|x|X|\s*)(\d+)/);
          if (qtyMatch) qty = parseInt(qtyMatch[1], 10);

          const singleLimit = p.limit !== '' ? (parseInt(p.limit, 10) || 0) : globalLimit;
          if (singleLimit > 0 && qty > singleLimit) qty = singleLimit;

          const sizeMatch = line.match(/(?:尺寸|號)?\s*(S|M|L|XL|2XL|3XL)/i);
          let sizeNote = sizeMatch ? `尺寸:${sizeMatch[1].toUpperCase()}` : '';

          if (currentName) {
            if (!buyerMap[currentName]) {
              buyerMap[currentName] = { items: {}, notes: '', canVip: false };
              buyerOrder.push(currentName);
            }
            buyerMap[currentName].items[p.name] = (buyerMap[currentName].items[p.name] || 0) + qty;
            if (singleLimit > 0 && buyerMap[currentName].items[p.name] > singleLimit) {
              buyerMap[currentName].items[p.name] = singleLimit;
            }
            if (sizeNote && !buyerMap[currentName].notes.includes(sizeNote)) {
              buyerMap[currentName].notes = (buyerMap[currentName].notes ? buyerMap[currentName].notes + '；' : '') + sizeNote;
            }
          }
        }
      });

      let isJunk = junkWords.some(j => line === j || line.startsWith(j));
      let isProductSyntax = products.some(p => line.includes(p.name));

      if (!matchedLine && !isProductSyntax && !timePattern.test(line) && !isJunk && line.length < 30) {
        currentName = line;
      }
    }

    g.buyers = buyerOrder.map((name, index) => ({
      name,
      items: buyerMap[name].items,
