<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芊芊代購 - 智慧團務整理系統 (一鍵清除與防漏版)</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary-color: #f06292;
      --primary-hover: #e91e63;
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      color: #c2185b;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #880e4f;
      border-left: 5px solid var(--primary-color);
      padding-left: 10px;
      margin-top: 25px;
      margin-bottom: 15px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }
    .product-row, .alias-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 40px;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .alias-row {
      grid-template-columns: 2fr 2fr 40px;
    }
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: #78909c;
    }
    .btn-secondary:hover {
      background-color: #546e7a;
    }
    .btn-success {
      background-color: #2e7d32;
    }
    .btn-success:hover {
      background-color: #1b5e20;
    }
    .btn-reset {
      background-color: #ff9800;
    }
    .btn-reset:hover {
      background-color: #f57c00;
    }
    .btn-del {
      background-color: #ef5350;
      padding: 8px;
      border-radius: 50%;
      line-height: 1;
      color: white;
      border: none;
      cursor: pointer;
    }
    .btn-del:hover {
      background-color: #c62828;
    }
    .upload-area {
      border: 2px dashed var(--primary-color);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background: #fff5f8;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .upload-area:hover {
      background: #ffe0b2;
    }
    #ocrStatus {
      font-weight: bold;
      color: #d81b60;
      margin-top: 5px;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background-color: #f8bbd0;
      color: #880e4f;
    }
    tr:nth-child(even) {
      background-color: #fcfcfc;
    }
    .badge-success {
      background: #c8e6c9;
      color: #2e7d32;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-fail {
      background: #ffcdd2;
      color: #c62828;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .tip-box {
      background-color: #e1f5fe;
      border-left: 4px solid #0288d1;
      padding: 10px 15px;
      font-size: 0.88rem;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .warn-box {
      background-color: #fff3e0;
      border-left: 4px solid #ff9800;
      padding: 10px 15px;
      font-size: 0.88rem;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>芊芊代購 - 智慧代購整理軟體</h1>

  <!-- 步驟 1：開團設定 -->
  <div class="section-title">步驟 1：開團基本設定與正式商品</div>
  <div class="grid-2">
    <div>
      <label>開團名稱 (例如：0928平行受注團)</label>
      <input type="text" id="groupName" value="0928平行受注團">
    </div>
    <div>
      <label>每人每款限購上限 (設 0 表示不限購)</label>
      <input type="number" id="limitQty" value="1" min="0">
    </div>
  </div>

  <div style="margin-top: 15px;">
    <label>正式商品清單 (名稱 / 日幣 / 台幣定價 / 實際買到數［採購完再填］)</label>
    <div id="productList"></div>
    <button class="btn btn-secondary" onclick="addProductRow()" style="margin-top: 5px;">+ 新增正式商品</button>
  </div>

  <!-- 同義詞 / 別名設定 -->
  <div class="section-title">自訂俗稱對照 (非必填)</div>
  <div class="tip-box">
    💡 <b>智慧比對已開啟：</b> 只要喊單包含「平行世界小八」，無論後面接小娃、吊飾、(小) 等都會自動歸類為正式商品「平行世界小八」！
  </div>
  <div id="aliasList"></div>
  <button class="btn btn-secondary" onclick="addAliasRow()" style="margin-top: 5px;">+ 新增俗稱對照</button>

  <!-- 步驟 2：匯入喊單 -->
  <div class="section-title">步驟 2：匯入喊單文字 (貼上 LINE 記事本內容)</div>
  
  <div class="upload-area" onclick="document.getElementById('imageInput').click()">
    📸 <b>點擊上傳截圖辨識 (備用)</b>
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    <div id="ocrStatus"></div>
  </div>

  <label>貼上 LINE 記事本內文：</label>
  <textarea id="rawLineText" placeholder="請直接貼上 LINE 記事本對話內容..."></textarea>
  
  <div class="actions">
    <button class="btn" onclick="processOrders()">1. 解析留言並匯入</button>
    <button class="btn btn-secondary" onclick="sortOrders()">2. 智慧整理排序</button>
    <button class="btn btn-reset" onclick="clearAllData()">🧹 一鍵清空內容 (開新團)</button>
  </div>

  <div id="warningBox" class="warn-box"></div>

  <!-- 整理結果預覽 -->
  <div class="section-title">階段一：登記名單與預覽 (<span id="buyerCount">0</span> 人)</div>
  <div style="overflow-x: auto;">
    <table id="previewTable">
      <thead>
        <tr id="previewHeader">
          <th>名字</th>
          <th>品項</th>
          <th>台幣價格</th>
          <th>日幣價格</th>
        </tr>
      </thead>
      <tbody id="previewBody">
        <tr><td colspan="4" style="text-align:center; color:#999;">尚未匯入名單</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions" style="margin-top: 15px;">
    <button class="btn btn-success" onclick="exportGroupExcel()">📥 匯出舊版格式『開團登記表』Excel</button>
  </div>

  <!-- 步驟 3：最終買到名單 -->
  <div class="section-title">階段二：採購完成後分配結果</div>
  <button class="btn" onclick="calculateFinalResults()">3. 生成買到名單 (需先在上方填寫實際買到數)</button>
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>名字</th>
          <th>買到品項</th>
          <th>數量</th>
          <th>分配結果</th>
        </tr>
      </thead>
      <tbody id="finalBody">
        <tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions" style="margin-top: 15px;">
    <button class="btn btn-success" onclick="exportFinalExcel()">📥 匯出『最終買到名單』Excel</button>
  </div>
</div>

<script>
  let defaultProducts = [
    { name: '平行世界小八', jpy: 1650, twd: 400, bought: '' },
    { name: '平行世界吉伊', jpy: 1650, twd: 400, bought: '' }
  ];

  let parsedBuyers = [];
  let calculatedResults = [];

  window.onload = function() {
    defaultProducts.forEach(p => addProductRow(p.name, p.jpy, p.twd, p.bought));
  };

  function addProductRow(name = '', jpy = '', twd = '', bought = '') {
    const div = document.createElement('div');
    div.className = 'product-row';
    div.innerHTML = `
      <input type="text" placeholder="正式商品名稱" class="p-name" value="${name}">
      <input type="number" placeholder="日幣" class="p-jpy" value="${jpy}">
      <input type="number" placeholder="台幣定價" class="p-twd" value="${twd}">
      <input type="number" placeholder="實際買到數" class="p-bought" value="${bought}">
      <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('productList').appendChild(div);
  }

  function addAliasRow(aliases = '', official = '') {
    const div = document.createElement('div');
    div.className = 'alias-row';
    div.innerHTML = `
      <input type="text" placeholder="客人寫的俗稱 (例如: 小八娃)" class="a-alias" value="${aliases}">
      <input type="text" placeholder="自動轉為正式品名" class="a-official" value="${official}">
      <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('aliasList').appendChild(div);
  }

  function getProducts() {
    const rows = document.querySelectorAll('.product-row');
    const products = [];
    rows.forEach(r => {
      const name = r.querySelector('.p-name').value.trim();
      const jpy = parseFloat(r.querySelector('.p-jpy').value) || 0;
      const twd = parseFloat(r.querySelector('.p-twd').value) || 0;
      const boughtVal = r.querySelector('.p-bought').value;
      const bought = boughtVal === '' ? 9999 : parseInt(boughtVal, 10);
      if (name) {
        products.push({ name, jpy, twd, bought: isNaN(bought) ? 9999 : bought });
      }
    });
    return products;
  }

  function getAliasMap() {
    const rows = document.querySelectorAll('.alias-row');
    const aliasMap = {};
    rows.forEach(r => {
      const aliasesStr = r.querySelector('.a-alias').value.trim();
      const official = r.querySelector('.a-official').value.trim();
      if (aliasesStr && official) {
        const list = aliasesStr.split(/[,，]/);
        list.forEach(a => {
          if (a.trim()) aliasMap[a.trim()] = official;
        });
      }
    });
    return aliasMap;
  }

  function matchOfficialItem(rawText, products, aliasMap) {
    let text = rawText.trim();
    if (!text) return null;

    if (aliasMap[text]) return aliasMap[text];
    for (let alias in aliasMap) {
      if (text.includes(alias)) return aliasMap[alias];
    }

    const sortedProducts = [...products].sort((a, b) => b.name.length - a.name.length);
    for (let p of sortedProducts) {
      if (text.includes(p.name) || p.name.includes(text.replace(/小娃|吊飾|娃|\(小\)|（小）|\s+/g, ''))) {
        return p.name;
      }
    }
    return text;
  }

  // 1. 解析喊單
  function processOrders() {
    const rawText = document.getElementById('rawLineText').value;
    if (!rawText.trim()) {
      alert('請先貼上 LINE 喊單對話！');
      return;
    }

    const limitQty = parseInt(document.getElementById('limitQty').value, 10) || 0;
    const aliasMap = getAliasMap();
    const products = getProducts();
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    
    const buyerMap = {};
    const buyerOrder = [];
    let currentName = '';
    const timePattern = /(\d+月\d+日|昨天|前天|今天)?\s*(上午|下午)?\s*\d+:\d+/;
    const unparsedLines = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (timePattern.test(line)) continue;

      const itemMatches = [...line.matchAll(/(.+?)(?:\+|\*|x|X|\s+)(\d+)/g)];

      if (itemMatches.length > 0) {
        if (!currentName && i > 0) currentName = lines[i - 1];

        if (currentName) {
          if (!buyerMap[currentName]) {
            buyerMap[currentName] = { items: {} };
            buyerOrder.push(currentName);
          }

          itemMatches.forEach(m => {
            let rawItem = m[1].replace(/^(.*?)\*1\s*/, '').trim();
            let qty = parseInt(m[2], 10);
            let officialItem = matchOfficialItem(rawItem, products, aliasMap);

            if (limitQty > 0 && qty > limitQty) qty = limitQty;

            buyerMap[currentName].items[officialItem] = (buyerMap[currentName].items[officialItem] || 0) + qty;
            if (limitQty > 0 && buyerMap[currentName].items[officialItem] > limitQty) {
              buyerMap[currentName].items[officialItem] = limitQty;
            }
          });
        }
      } else {
        if (!timePattern.test(line) && line.length < 20) {
          currentName = line;
        } else {
          unparsedLines.push(line);
        }
      }
    }

    parsedBuyers = buyerOrder.map((name, index) => ({
      name,
      items: buyerMap[name].items,
      originalIndex: index
    }));

    renderPreview();

    const warnBox = document.getElementById('warningBox');
    if (unparsedLines.length > 0) {
      warnBox.style.display = 'block';
      warnBox.innerHTML = `⚠️ <b>注意事項：</b> 有 ${unparsedLines.length} 行文字未辨識為喊單（可能是聊天或未帶+1）：<br>` + unparsedLines.join('<br>');
    } else {
      warnBox.style.display = 'none';
    }

    alert(`解析成功！共抓取 ${parsedBuyers.length} 位買家名單，已完成金額精算！`);
  }

  // 2. 智慧整理排序
  function sortOrders() {
    if (parsedBuyers.length === 0) {
      alert('無資料可排序！');
      return;
    }

    parsedBuyers.sort((a, b) => {
      const aKeys = Object.keys(a.items);
      const bKeys = Object.keys(b.items);
      const aTypes = aKeys.length;
      const bTypes = bKeys.length;

      if (aTypes !== bTypes) return bTypes - aTypes;
      if (aTypes === 1 && bTypes === 1) {
        if (aKeys[0] !== bKeys[0]) {
          return aKeys[0].localeCompare(bKeys[0], 'zh-Hant');
        }
      }
      return a.originalIndex - b.originalIndex;
    });

    renderPreview();
    alert('智慧整理排序完成！');
  }

  function renderPreview() {
    const products = getProducts();
    const header = document.getElementById('previewHeader');
    header.innerHTML = `<th>名字</th><th>品項</th><th>台幣價格</th><th>日幣價格</th>`;
    products.forEach(p => header.innerHTML += `<th>${p.name}</th>`);

    const tbody = document.getElementById('previewBody');
    tbody.innerHTML = '';
    document.getElementById('buyerCount').innerText = parsedBuyers.length;

    parsedBuyers.forEach(b => {
      let itemText = [];
      let totalTwd = 0;
      let totalJpy = 0;

      Object.keys(b.items).forEach(k => {
        const q = b.items[k];
        itemText.push(q > 1 ? `${k}*${q}` : k);
        const pInfo = products.find(p => p.name === k);
        if (pInfo) {
          totalTwd += pInfo.twd * q;
          totalJpy += pInfo.jpy * q;
        }
      });

      let trHtml = `<td><b>${b.name}</b></td><td>${itemText.join('+')}</td><td><b>$${totalTwd}</b></td><td>¥${totalJpy}</td>`;
      products.forEach(p => {
        trHtml += `<td>${b.items[p.name] || ''}</td>`;
      });

      const tr = document.createElement('tr');
      tr.innerHTML = trHtml;
      tbody.appendChild(tr);
    });
  }

  // 3. 生成買到名單
  function calculateFinalResults() {
    const products = getProducts();
    const stockMap = {};
    products.forEach(p => stockMap[p.name] = p.bought);

    const tbody = document.getElementById('finalBody');
    tbody.innerHTML = '';
    calculatedResults = [];

    parsedBuyers.forEach(b => {
      let gotItems = [];
      let requestedCount = 0;
      let gotCount = 0;

      Object.keys(b.items).forEach(k => {
        const qty = b.items[k];
        requestedCount += qty;
        const stock = stockMap[k] !== undefined ? stockMap[k] : 0;

        if (stock >= qty) {
          stockMap[k] -= qty;
          gotCount += qty;
          gotItems.push(qty > 1 ? `${k}*${qty}` : k);
        } else if (stock > 0) {
          gotCount += stock;
          gotItems.push(`${k}*${stock}(部分)`);
          stockMap[k] = 0;
        }
      });

      let statusText = '未買到';
      let statusBadge = `<span class="badge-fail">未買到</span>`;
      if (gotCount === requestedCount && requestedCount > 0) {
        statusText = '有買到';
        statusBadge = `<span class="badge-success">有買到</span>`;
      } else if (gotCount > 0) {
        statusText = '部分買到';
        statusBadge = `<span class="badge-success">部分買到</span>`;
      }

      calculatedResults.push({
        name: b.name,
        gotItemsStr: gotItems.join('+') || '無',
        gotCount,
        statusText
      });

      const tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${b.name}</b></td><td>${gotItems.join('+') || '無'}</td><td>${gotCount}</td><td>${statusBadge}</td>`;
      tbody.appendChild(tr);
    });

    alert('買到名單分配計算完成！');
  }

  // 一鍵清除內容
  function clearAllData() {
    if (confirm('確定要清空喊單文字與已整理的名單嗎？（不會清除設定好的商品與別名）')) {
      document.getElementById('rawLineText').value = '';
      parsedBuyers = [];
      calculatedResults = [];
      document.getElementById('previewBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">尚未匯入名單</td></tr>`;
      document.getElementById('finalBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>`;
      document.getElementById('buyerCount').innerText = '0';
      document.getElementById('warningBox').style.display = 'none';
      alert('已清空所有文字與名單內容！可以開始整理新的一團了。');
    }
  }

  // 匯出舊版格式『開團登記表』 Excel
  function exportGroupExcel() {
    if (parsedBuyers.length === 0) {
      alert('請先匯入喊單資料！');
      return;
    }

    const groupName = document.getElementById('groupName').value.trim() || '團務表';
    const products = getProducts();

    const sheetData = [];
    sheetData.push([]); // Row 1

    // Row 2: 品名
    const row2 = ['品名'];
    products.forEach(p => row2.push(p.name));
    sheetData.push(row2);

    // Row 3: 日幣
    const row3 = ['日幣'];
    products.forEach(p => row3.push(p.jpy));
    sheetData.push(row3);

    // Row 4: 定價(未二補)
    const row4 = ['定價(未二補)'];
    products.forEach(p => row4.push(p.twd));
    sheetData.push(row4);

    // Row 5: 總數
    const row5 = ['總數'];
    products.forEach(p => {
      let sum = 0;
      parsedBuyers.forEach(b => sum += (b.items[p.name] || 0));
      row5.push(sum);
    });
    sheetData.push(row5);

    sheetData.push([]); // Row 6

    // Row 7: 表頭
    const row7 = ['名字', '品項', '價格', '日幣', '備註'];
    sheetData.push(row7);

    // Row 8+: 買家資料
    parsedBuyers.forEach(b => {
      let itemStrParts = [];
      let totalTwd = 0;
      let totalJpy = 0;

      Object.keys(b.items).forEach(k => {
        const q = b.items[k];
        itemStrParts.push(q > 1 ? `${k}*${q}` : k);
        const pInfo = products.find(p => p.name === k);
        if (pInfo) {
          totalTwd += pInfo.twd * q;
          totalJpy += pInfo.jpy * q;
        }
      });

      const row = [b.name, itemStrParts.join('+'), totalTwd, totalJpy, ''];
      products.forEach(p => row.push(b.items[p.name] || ''));
      sheetData.push(row);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    XLSX.utils.book_append_sheet(wb, ws, groupName);
    XLSX.writeFile(wb, `${groupName}_開團登記表.xlsx`);
  }

  // 匯出『買到名單』 Excel
  function exportFinalExcel() {
    if (calculatedResults.length === 0) {
      alert('請先點擊「3. 生成買到名單」！');
      return;
    }

    const groupName = document.getElementById('groupName').value.trim() || '團務表';
    const sheetData = [['名字', '買到品項', '數量', '分配結果']];

    calculatedResults.forEach(r => {
      sheetData.push([r.name, r.gotItemsStr, r.gotCount, r.statusText]);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    XLSX.utils.book_append_sheet(wb, ws, '買到名單');
    XLSX.writeFile(wb, `${groupName}_最終買到名單.xlsx`);
  }
</script>
</body>
</html>
