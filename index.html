<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芊芊代購 - 智慧團務整理系統 (商品記憶與一鍵清空版)</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-color: #f06292;
      --primary-hover: #e91e63;
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      color: #c2185b;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #880e4f;
      border-left: 5px solid var(--primary-color);
      padding-left: 10px;
      margin-top: 25px;
      margin-bottom: 15px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    textarea {
      height: 120px;
      resize: vertical;
    }
    .product-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.2fr 1.2fr 40px 40px;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: #78909c;
    }
    .btn-secondary:hover {
      background-color: #546e7a;
    }
    .btn-success {
      background-color: #2e7d32;
    }
    .btn-success:hover {
      background-color: #1b5e20;
    }
    .btn-reset {
      background-color: #ff9800;
    }
    .btn-reset:hover {
      background-color: #f57c00;
    }
    .btn-copy {
      background-color: #0288d1;
      padding: 8px;
      border-radius: 6px;
      line-height: 1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-copy:hover {
      background-color: #01579b;
    }
    .btn-del {
      background-color: #ef5350;
      padding: 8px;
      border-radius: 50%;
      line-height: 1;
      color: white;
      border: none;
      cursor: pointer;
    }
    .btn-del:hover {
      background-color: #c62828;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background-color: #f8bbd0;
      color: #880e4f;
    }
    tr:nth-child(even) {
      background-color: #fcfcfc;
    }
    .badge-success {
      background: #c8e6c9;
      color: #2e7d32;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-fail {
      background: #ffcdd2;
      color: #c62828;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .import-box {
      background-color: #f3e5f5;
      border: 2px dashed #ab47bc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .history-bar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>芊芊代購 - 智慧代購整理軟體</h1>

  <!-- 舊檔還原備用 -->
  <div class="import-box">
    📂 <b>久遠採購回來？點此匯入之前的『開團登記表 Excel』直接還原名單：</b>
    <input type="file" id="excelInput" accept=".xlsx, .xls" style="margin-top: 5px;" onchange="importExcelFile(event)">
  </div>

  <!-- 步驟 1：開團設定 -->
  <div class="section-title">步驟 1：開團基本設定與商品 (支援商品記憶與一鍵清空)</div>
  <div class="grid-2">
    <div>
      <label>開團名稱 (例如：0928平行受注團)</label>
      <input type="text" id="groupName" value="0928平行受注團">
    </div>
    <div>
      <label>計算匯率 (日幣 × 匯率 ＝ 台幣定價)</label>
      <input type="number" id="exchangeRate" value="0.24" step="0.001">
    </div>
  </div>

  <div style="margin-top: 15px;">
    <label>商品清單 (名稱 / 日幣 / 台幣 / 個別特例限購 / 實際買到數)</label>
    <div id="productList"></div>
    
    <datalist id="historyProductList"></datalist>

    <div class="actions">
      <button class="btn btn-secondary" onclick="addProductRow()">+ 新增空白商品</button>
      <button class="btn btn-del" style="border-radius:6px; padding:10px 15px;" onclick="clearProductRows()">🗑️ 一鍵清空所有商品</button>
    </div>

    <!-- 歷史商品快速選單 -->
    <div class="history-bar">
      <label style="margin:0; white-space:nowrap;">📜 快捷帶回歷史商品：</label>
      <select id="historySelect" onchange="addFromHistory(this.value)">
        <option value="">-- 請選擇曾建立過的歷史商品 --</option>
      </select>
    </div>
  </div>

  <!-- 步驟 2：匯入喊單 -->
  <div class="section-title">步驟 2：匯入喊單文字 (貼上 LINE 記事本內容)</div>
  <textarea id="rawLineText" placeholder="請直接貼上 LINE 記事本對話內容..."></textarea>
  
  <div class="actions">
    <button class="btn" onclick="processOrders()">1. 解析留言並匯入</button>
    <button class="btn btn-secondary" onclick="sortOrders()">2. 智慧整理排序</button>
    <button class="btn btn-reset" onclick="clearAllData()">🧹 一鍵清空對話與名單 (開新團)</button>
  </div>

  <!-- 整理結果預覽 -->
  <div class="section-title">階段一：登記名單與預覽 (<span id="buyerCount">0</span> 人)</div>
  <div style="overflow-x: auto;">
    <table id="previewTable">
      <thead>
        <tr id="previewHeader">
          <th>名字</th>
          <th>品項</th>
          <th>台幣價格</th>
          <th>日幣價格</th>
        </tr>
      </thead>
      <tbody id="previewBody">
        <tr><td colspan="4" style="text-align:center; color:#999;">尚未匯入名單</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions" style="margin-top: 15px;">
    <button class="btn btn-success" onclick="exportGroupExcel()">📥 匯出舊版格式『開團登記表』Excel</button>
  </div>

  <!-- 步驟 3：最終買到名單 -->
  <div class="section-title">階段二：採購完成後分配結果</div>
  <button class="btn" onclick="calculateFinalResults()">3. 生成買到名單 (請先在上方填寫實際買到數)</button>
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>名字</th>
          <th>買到品項</th>
          <th>數量</th>
          <th>分配結果</th>
        </tr>
      </thead>
      <tbody id="finalBody">
        <tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>
      </tbody>
    </table>
  </div>

  <div class="actions" style="margin-top: 15px;">
    <button class="btn btn-success" onclick="exportFinalExcel()">📥 匯出『最終買到名單』Excel</button>
  </div>
</div>

<script>
  let defaultProducts = [
    { name: '平行世界小八', jpy: 1650, twd: 400, limit: '', bought: '' },
    { name: '平行世界吉伊', jpy: 1650, twd: 400, limit: '', bought: '' }
  ];

  let parsedBuyers = [];
  let calculatedResults = [];
  let productHistory = JSON.parse(localStorage.getItem('qian_product_history') || '{}');

  window.onload = function() {
    defaultProducts.forEach(p => addProductRow(p.name, p.jpy, p.twd, p.limit, p.bought));
    updateHistoryUI();
  };

  function addProductRow(name = '', jpy = '', twd = '', limit = '', bought = '') {
    const div = document.createElement('div');
    div.className = 'product-row';
    div.innerHTML = `
      <input type="text" placeholder="正式商品名稱" class="p-name" value="${name}" list="historyProductList" onchange="saveToHistory(this)">
      <input type="number" placeholder="日幣" class="p-jpy" value="${jpy}" onchange="calcRowTwd(this); saveToHistory(this);">
      <input type="number" placeholder="台幣定價" class="p-twd" value="${twd}" onchange="saveToHistory(this)">
      <input type="number" placeholder="限購上限(無不填)" class="p-limit" value="${limit}" onchange="saveToHistory(this)">
      <input type="number" placeholder="實際買到數" class="p-bought" value="${bought}">
      <button class="btn-copy" title="複製此商品資訊" onclick="copyProductRow(this)">📋</button>
      <button class="btn-del" title="刪除此商品" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('productList').appendChild(div);
  }

  // 儲存商品至瀏覽器快取記憶
  function saveToHistory(elem) {
    const row = elem.parentElement;
    const name = row.querySelector('.p-name').value.trim();
    const jpy = row.querySelector('.p-jpy').value;
    const twd = row.querySelector('.p-twd').value;
    const limit = row.querySelector('.p-limit').value;

    if (name) {
      productHistory[name] = { name, jpy, twd, limit };
      localStorage.setItem('qian_product_history', JSON.stringify(productHistory));
      updateHistoryUI();
    }
  }

  // 更新歷史選單 UI
  function updateHistoryUI() {
    const dataList = document.getElementById('historyProductList');
    const selectElem = document.getElementById('historySelect');
    
    dataList.innerHTML = '';
    selectElem.innerHTML = '<option value="">-- 請選擇曾建立過的歷史商品 --</option>';

    Object.keys(productHistory).forEach(key => {
      const p = productHistory[key];
      
      const opt1 = document.createElement('option');
      opt1.value = p.name;
      dataList.appendChild(opt1);

      const opt2 = document.createElement('option');
      opt2.value = p.name;
      opt2.innerText = `${p.name} (日幣:¥${p.jpy} / 台幣:$${p.twd})`;
      selectElem.appendChild(opt2);
    });
  }

  // 從歷史紀錄一鍵帶回品項
  function addFromHistory(name) {
    if (!name || !productHistory[name]) return;
    const p = productHistory[name];
    addProductRow(p.name, p.jpy, p.twd, p.limit, '');
    document.getElementById('historySelect').value = '';
  }

  // 一鍵清空所有商品
  function clearProductRows() {
    if (confirm('確定要清空目前頁面上的商品列表嗎？（歷史記憶依然會保留，隨時可重新選取加入）')) {
      document.getElementById('productList').innerHTML = '';
    }
  }

  function copyProductRow(btnElem) {
    const row = btnElem.parentElement;
    const name = row.querySelector('.p-name').value;
    const jpy = row.querySelector('.p-jpy').value;
    const twd = row.querySelector('.p-twd').value;
    const limit = row.querySelector('.p-limit').value;
    const bought = row.querySelector('.p-bought').value;
    
    addProductRow(name, jpy, twd, limit, bought);
  }

  function calcRowTwd(inputElem) {
    const row = inputElem.parentElement;
    const jpy = parseFloat(inputElem.value) || 0;
    const rate = parseFloat(document.getElementById('exchangeRate').value) || 0.24;
    const twdInput = row.querySelector('.p-twd');
    if (jpy > 0 && !twdInput.value) {
      twdInput.value = Math.round(jpy * rate);
    }
  }

  function getProducts() {
    const rows = document.querySelectorAll('.product-row');
    const products = [];
    rows.forEach(r => {
      const name = r.querySelector('.p-name').value.trim();
      const jpy = parseFloat(r.querySelector('.p-jpy').value) || 0;
      const twd = parseFloat(r.querySelector('.p-twd').value) || 0;
      const limitVal = r.querySelector('.p-limit').value.trim();
      const limit = limitVal !== '' ? (parseInt(limitVal, 10) || 0) : 0;
      const boughtVal = r.querySelector('.p-bought').value;
      const bought = boughtVal === '' ? 9999 : parseInt(boughtVal, 10);
      if (name) {
        products.push({ name, jpy, twd, limit, bought: isNaN(bought) ? 9999 : bought });
      }
    });
    return products;
  }

  function processOrders() {
    const rawText = document.getElementById('rawLineText').value;
    if (!rawText.trim()) {
      alert('請先貼上 LINE 喊單對話！');
      return;
    }

    const products = getProducts();
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    
    const buyerMap = {};
    const buyerOrder = [];
    let currentName = '';
    const timePattern = /(\d+月\d+日|昨天|前天|今天)?\s*(上午|下午)?\s*\d+:\d+/;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (timePattern.test(line)) continue;

      let matchedLine = false;

      products.forEach(p => {
        if (line.includes(p.name) || p.name.includes(line.replace(/小娃|吊飾|娃|\(小\)|（小）|\s+/g, ''))) {
          matchedLine = true;
          let qty = 1;
          const qtyMatch = line.match(/(?:\+|\*|x|X|\s*)(\d+)/);
          if (qtyMatch) qty = parseInt(qtyMatch[1], 10);

          if (p.limit > 0 && qty > p.limit) qty = p.limit;

          if (!currentName && i > 0) currentName = lines[i - 1];

          if (currentName) {
            if (!buyerMap[currentName]) {
              buyerMap[currentName] = { items: {} };
              buyerOrder.push(currentName);
            }
            buyerMap[currentName].items[p.name] = (buyerMap[currentName].items[p.name] || 0) + qty;
            if (p.limit > 0 && buyerMap[currentName].items[p.name] > p.limit) {
              buyerMap[currentName].items[p.name] = p.limit;
            }
          }
        }
      });

      if (!matchedLine && !timePattern.test(line) && line.length < 20) {
        currentName = line;
      }
    }

    parsedBuyers = buyerOrder.map((name, index) => ({
      name,
      items: buyerMap[name].items,
      originalIndex: index
    }));

    renderPreview();
    alert(`解析成功！共抓取 ${parsedBuyers.length} 位買家名單！`);
  }

  function sortOrders() {
    if (parsedBuyers.length === 0) {
      alert('無資料可排序！');
      return;
    }

    parsedBuyers.sort((a, b) => {
      const aKeys = Object.keys(a.items);
      const bKeys = Object.keys(b.items);
      const aTypes = aKeys.length;
      const bTypes = bKeys.length;

      if (aTypes !== bTypes) return bTypes - aTypes;
      if (aTypes === 1 && bTypes === 1) {
        if (aKeys[0] !== bKeys[0]) {
          return aKeys[0].localeCompare(bKeys[0], 'zh-Hant');
        }
      }
      return a.originalIndex - b.originalIndex;
    });

    renderPreview();
    alert('智慧整理排序完成！');
  }

  function renderPreview() {
    const products = getProducts();
    const header = document.getElementById('previewHeader');
    header.innerHTML = `<th>名字</th><th>品項</th><th>台幣價格</th><th>日幣價格</th>`;

    const tbody = document.getElementById('previewBody');
    tbody.innerHTML = '';
    document.getElementById('buyerCount').innerText = parsedBuyers.length;

    parsedBuyers.forEach(b => {
      let itemText = [];
      let totalTwd = 0;
      let totalJpy = 0;

      Object.keys(b.items).forEach(k => {
        const q = b.items[k];
        itemText.push(q > 1 ? `${k}*${q}` : k);
        const pInfo = products.find(p => p.name === k);
        if (pInfo) {
          totalTwd += pInfo.twd * q;
          totalJpy += pInfo.jpy * q;
        }
      });

      let trHtml = `<td><b>${b.name}</b></td><td>${itemText.join('+')}</td><td><b>$${totalTwd}</b></td><td>¥${totalJpy}</td>`;
      const tr = document.createElement('tr');
      tr.innerHTML = trHtml;
      tbody.appendChild(tr);
    });
  }

  function calculateFinalResults() {
    const products = getProducts();
    const stockMap = {};
    products.forEach(p => stockMap[p.name] = p.bought);

    const tbody = document.getElementById('finalBody');
    tbody.innerHTML = '';
    calculatedResults = [];

    parsedBuyers.forEach(b => {
      let gotItems = [];
      let requestedCount = 0;
      let gotCount = 0;

      Object.keys(b.items).forEach(k => {
        const qty = b.items[k];
        requestedCount += qty;
        const stock = stockMap[k] !== undefined ? stockMap[k] : 0;

        if (stock >= qty) {
          stockMap[k] -= qty;
          gotCount += qty;
          gotItems.push(qty > 1 ? `${k}*${qty}` : k);
        } else if (stock > 0) {
          gotCount += stock;
          gotItems.push(`${k}*${stock}(部分)`);
          stockMap[k] = 0;
        }
      });

      let statusText = '未買到';
      let statusBadge = `<span class="badge-fail">未買到</span>`;
      if (gotCount === requestedCount && requestedCount > 0) {
        statusText = '有買到';
        statusBadge = `<span class="badge-success">有買到</span>`;
      } else if (gotCount > 0) {
        statusText = '部分買到';
        statusBadge = `<span class="badge-success">部分買到</span>`;
      }

      calculatedResults.push({
        name: b.name,
        gotItemsStr: gotItems.join('+') || '無',
        gotCount,
        statusText
      });

      const tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${b.name}</b></td><td>${gotItems.join('+') || '無'}</td><td>${gotCount}</td><td>${statusBadge}</td>`;
      tbody.appendChild(tr);
    });

    alert('買到名單分配計算完成！');
  }

  function importExcelFile(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

      if (json.length < 8) {
        alert('無效的開團登記表 Excel 格式！');
        return;
      }

      const pNames = json[1].slice(1);
      const pJpys = json[2].slice(1);
      const pTwds = json[3].slice(1);

      document.getElementById('productList').innerHTML = '';
      pNames.forEach((name, idx) => {
        if (name) addProductRow(name, pJpys[idx] || 0, pTwds[idx] || 0, '', '');
      });

      parsedBuyers = [];
      for (let r = 7; r < json.length; r++) {
        const row = json[r];
        if (row && row[0]) {
          const name = row[0];
          const items = {};
          pNames.forEach((pName, pIdx) => {
            const qty = parseInt(row[5 + pIdx], 10) || 0;
            if (qty > 0 && pName) items[pName] = qty;
          });
          parsedBuyers.push({ name, items, originalIndex: r });
        }
      }

      renderPreview();
      alert(`成功還原 【${file.name}】 名單！共 ${parsedBuyers.length} 位買家，請直接在上方填寫採購數量進行分配！`);
    };
    reader.readAsArrayBuffer(file);
  }

  function clearAllData() {
    if (confirm('確定要清空喊單文字與已整理的名單嗎？')) {
      document.getElementById('rawLineText').value = '';
      parsedBuyers = [];
      calculatedResults = [];
      document.getElementById('previewBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">尚未匯入名單</td></tr>`;
      document.getElementById('finalBody').innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">尚未計算分配結果</td></tr>`;
      document.getElementById('buyerCount').innerText = '0';
      alert('已清空對話與名單！');
    }
  }

  function exportGroupExcel() {
    if (parsedBuyers.length === 0) {
      alert('請先匯入喊單資料！');
      return;
    }

    const groupName = document.getElementById('groupName').value.trim() || '團務表';
    const products = getProducts();

    const sheetData = [];
    sheetData.push([]); // Row 1

    const row2 = ['品名'];
    products.forEach(p => row2.push(p.name));
    sheetData.push(row2);

    const row3 = ['日幣'];
    products.forEach(p => row3.push(p.jpy));
    sheetData.push(row3);

    const row4 = ['定價(未二補)'];
    products.forEach(p => row4.push(p.twd));
    sheetData.push(row4);

    const row5 = ['總數'];
    products.forEach(p => {
      let sum = 0;
      parsedBuyers.forEach(b => sum += (b.items[p.name] || 0));
      row5.push(sum);
    });
    sheetData.push(row5);

    sheetData.push([]); // Row 6

    const row7 = ['名字', '品項', '價格', '日幣', '備註'];
    sheetData.push(row7);

    parsedBuyers.forEach(b => {
      let itemStrParts = [];
      let totalTwd = 0;
      let totalJpy = 0;

      Object.keys(b.items).forEach(k => {
        const q = b.items[k];
        itemStrParts.push(q > 1 ? `${k}*${q}` : k);
        const pInfo = products.find(p => p.name === k);
        if (pInfo) {
          totalTwd += pInfo.twd * q;
          totalJpy += pInfo.jpy * q;
        }
      });

      const row = [b.name, itemStrParts.join('+'), totalTwd, totalJpy, ''];
      sheetData.push(row);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    XLSX.utils.book_append_sheet(wb, ws, groupName);
    XLSX.writeFile(wb, `${groupName}_開團登記表.xlsx`);
  }

  function exportFinalExcel() {
    if (calculatedResults.length === 0) {
      alert('請先點擊「3. 生成買到名單」！');
      return;
    }

    const groupName = document.getElementById('groupName').value.trim() || '團務表';
    const sheetData = [['名字', '買到品項', '數量', '分配結果']];

    calculatedResults.forEach(r => {
      sheetData.push([r.name, r.gotItemsStr, r.gotCount, r.statusText]);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    XLSX.utils.book_append_sheet(wb, ws, '買到名單');
    XLSX.writeFile(wb, `${groupName}_最終買到名單.xlsx`);
  }
</script>
